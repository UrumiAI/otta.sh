name: Pack build

# Builds the template from the PACKED packages (scripts/pack-build.mjs, ADR-0045):
# pnpm pack of every publishable package, npm install in a copy of the template
# repository, astro build, then assertions on dist/. Nothing else tests the form
# merchants install (dist/integration.mjs from node_modules).
#
# Not a required check: it is its own workflow (not a step of `unit`), so it only
# gates merges if "Pack build / pack-build" is added to the branch protection
# rules. `unit` (which runs `test:pack-types`) is the existing required check; to
# make this one required, add it there once it has been green for a while.
#
# If it is made required: a required check that is skipped by the `paths:` filter
# below never reports, and that blocks the PR. Move the path filter into a
# job-level condition (e.g. a changed-files step) before doing so.
#
# A PR that moves a peer pin (sites/store's peerDependencies) fails this check
# until the template repository's pins are bumped to match.
#
# Template code runs in this job: `npm install` runs its dependencies' lifecycle
# scripts and `astro build` runs its astro.config.mjs. Any code in a job can write
# the Actions cache, and a cache saved in main's scope is restored by every
# ci.yml job (CodeQL actions/cache-poisoning). So this job never runs in main's
# scope: no push-to-main or schedule trigger, no dispatch on main, and the
# template is its own `main` or the commit TEMPLATE_REF below pins (no
# free-form ref input). Pull-request runs only save caches into that PR's scope.
#
# So this job does NOT run on a push to main or on a schedule. A change in the
# template repository, or a `~` patch release of a peer that breaks the packed
# build, shows up only on the next pull request that matches `paths:`, as a red
# check unrelated to that PR (ADR-0045 records this gap). The run logs the
# template commit it built; to rule the template out, pin TEMPLATE_REF to the
# last green commit in that PR. Revert the pin to `main` before merging: a run
# with a pin warns, and a pinned main stops catching template drift at all.
on:
  pull_request:
    paths:
      - "sites/store/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".nvmrc"
      - "scripts/pack-build.mjs"
      - ".github/workflows/pack-build.yml"
  # On a branch other than main only (the job condition below refuses main).
  workflow_dispatch:

permissions:
  contents: read

env:
  # The template ref to build: `main` by default. Set it to a commit SHA, in a
  # reviewed change to this file, to pin the template (never a dispatch input).
  TEMPLATE_REF: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack-build:
    # The template repository is not public until the ADR-0045 launch gates are met,
    # and the default token cannot read it before then. Set the repository variable
    # OTTA_TEMPLATE_PUBLIC=true once UrumiAI/otta-store-template is public; until
    # then the job is skipped rather than red.
    if: vars.OTTA_TEMPLATE_PUBLIC == 'true' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The template is its own repository, at TEMPLATE_REF (default `main`). Its
      # code runs in this job, so pass no secret here: the job only runs once the
      # template is public (OTTA_TEMPLATE_PUBLIC), and the default token can read
      # it then.
      - uses: actions/checkout@v4
        with:
          repository: UrumiAI/otta-store-template
          ref: ${{ env.TEMPLATE_REF }}
          path: otta-store-template
          persist-credentials: false
      # The template commit this run builds, in the log and the run summary.
      - name: Template commit
        run: |
          sha=$(git -C otta-store-template rev-parse HEAD)
          echo "UrumiAI/otta-store-template at $sha (TEMPLATE_REF=$TEMPLATE_REF)"
          echo "Template: UrumiAI/otta-store-template@$sha (TEMPLATE_REF=$TEMPLATE_REF)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TEMPLATE_REF" != "main" ]; then
            echo "::warning::TEMPLATE_REF is pinned to $TEMPLATE_REF, not main: revert the pin before merging"
          fi
      - uses: pnpm/action-setup@v4
      # No `cache: pnpm`, so this job never saves a pnpm cache, even into a PR's
      # scope. That is not what keeps main's cache safe (template code could still
      # write one directly); running only outside main's scope is (see the top).
      # setup-node v5+ enables caching by itself when package.json names a
      # packageManager: set `package-manager-cache: false` when upgrading.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # `pnpm pack` runs each package's prepack (tsdown), so no separate build.
      - run: pnpm test:pack-build
        env:
          OTTA_TEMPLATE_DIR: ${{ github.workspace }}/otta-store-template
