packages:
  - "packages/*"
  - "sites/*"
  - "examples/*"

# There are no `emdash` overrides any more. The host used to be a locally built
# merge of upstream `main` and its then-open conditional-write PR, vendored as
# `file:` tarballs and held in place by four overrides. `emdash@0.38.0` was the
# first release to ship that PR, so the manifests name the release directly; the
# repo now runs on `emdash@1.0.1`, and the store resolves a single copy on its
# own: the released `@emdash-cms/cloudflare@1.0.1` pins `emdash` EXACTLY at
# `1.0.1`, which is the same version the manifests ask for, and
# `@emdash-cms/admin` / `@emdash-cms/registry-client` export the subpaths
# (`./portable-text-table`, `./listing-policy`) whose absence once forced them
# to be vendored alongside the core.
#
# The one-copy outcome is a coincidence of agreement, not an invariant — a future release of
# `@emdash-cms/cloudflare` that pins a DIFFERENT exact `emdash` would put a second
# copy in the store, binding the Worker bridge to a host without the
# conditional-write primitives: no install error, no type error.
# `sites/staging/test/host-pin.test.ts` is what makes that loud, and an override
# pinning `emdash` to the version the manifests name would be the fix.
#
# If pins are ever reintroduced they must never float — no `^`, no `~` — so the
# host only moves when the manifests (and `host-pin.test.ts`) move with it. And
# they have to live here: pnpm 11 ignores `pnpm.overrides` in package.json
# without warning. The `overrides:` block below holds only security pins for
# transitive packages, none of them `emdash`.

overrides:
  # Security pins (Dependabot). Exact, never floating — see the note above. Each
  # names its advisories and when to drop it.
  # oxfmt@0.58.0 pins tinypool EXACTLY at 2.1.0 (GHSA-5gmw-xhrv-c9v3,
  # GHSA-85c8-ppgw-ccpr; fixed 2.1.2). Drop once the oxfmt catalog pin is >= ^0.67.0.
  "oxfmt>tinypool": 2.1.2
  # miniflare pins undici EXACTLY (4.x -> 7.28.0, 5.x-alpha -> 7.29.0), below the
  # fixes in 7.29.1 (GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3, GHSA-4cwx-7wf7-3272
  # and others). Drop once the wrangler/miniflare/vitest-plugin train ships >= 7.29.1.
  "miniflare>undici": 7.29.1
  # sharp < 0.35.5 (GHSA-wq5f-xc86-pv6w, GHSA-rgj7-g3m4-5g8c, GHSA-f88m-g3jw-g9cj).
  # Every miniflare release pins sharp exactly (4.x 0.34.5, 5.x 0.35.4); unscoped
  # because astro's optional `^0.35.4` and sites/staging's `^0.35.4` would
  # otherwise keep the locked 0.35.4 copy. Drop once miniflare pins >= 0.35.5.
  sharp: 0.35.5

allowBuilds:
  better-sqlite3: true
  # esbuild's postinstall only validates the preinstalled platform binary —
  # wrangler and the Astro toolchain (sites/staging) bundle through it.
  esbuild: true
  # sharp: sites/staging's Astro/EmDash chain installs it as a real
  # dependency (image processing), so its native build is allowed.
  sharp: true
  workerd: true

catalog:
  typescript: ^5.9.3
  vitest: ^4.1.10
  tsdown: ^0.22.4
  oxlint: ^1.73.0
  oxfmt: ^0.58.0
  kysely: ^0.29.3
  pg: ^8.22.0
  "@types/pg": ^8.20.0
  better-sqlite3: ^12.11.1
  "@types/better-sqlite3": ^7.6.13
  dependency-cruiser: ^18.0.0
  # wrangler ^4.68 -> ^4.99 because `@emdash-cms/cloudflare` declares
  # `peerDependencies.wrangler >= 4.99.0`.
  wrangler: ^4.99.0
  "@types/node": ^22.15.0
  fast-check: ^3.23.2
  "@playwright/test": ^1.62.1

minimumReleaseAgeExclude:
  # The D1 test tier's toolchain (`@cloudflare/vitest-plugin`), which pins its own
  # wrangler/miniflare exactly and therefore its own workerd — see the "D1 tier"
  # section of `packages/store-emdash/README.md`.
  - "@cloudflare/vitest-plugin@1.1.8"
  - "wrangler@4.131.1"
  - "miniflare@5.20260911.0-alpha"
  - workerd@1.20260710.1 || 1.20260911.1
  - "@cloudflare/workerd-darwin-64@1.20260710.1 || 1.20260911.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260710.1 || 1.20260911.1"
  - "@cloudflare/workerd-linux-64@1.20260710.1 || 1.20260911.1"
  - "@cloudflare/workerd-linux-arm64@1.20260710.1 || 1.20260911.1"
  - "@cloudflare/workerd-windows-64@1.20260710.1 || 1.20260911.1"
  # Nothing in this repo sets `minimumReleaseAge`, so this list only has an
  # effect under external pnpm config (a user or CI `.npmrc`) that does.
  #
  # The whole EmDash train is listed now. It used to omit `emdash`,
  # `@emdash-cms/admin`, `@emdash-cms/cloudflare` and `@emdash-cms/registry-client`
  # because they came from `vendor/` as `file:` tarballs, which bypass the
  # release-age check entirely; they resolve from the registry again, so they
  # need the exclusion like every sibling. The 1.0.1 train is younger than a
  # typical threshold.
  - "emdash@1.0.1"
  - "@emdash-cms/admin@1.0.1"
  - "@emdash-cms/auth@1.0.1"
  - "@emdash-cms/blocks@1.0.1"
  - "@emdash-cms/cloudflare@1.0.1"
  - "@emdash-cms/gutenberg-to-portable-text@1.0.1"
  - "@emdash-cms/plugin-types@0.5.0"
  - "@emdash-cms/registry-client@0.7.0"
  - "@emdash-cms/registry-lexicons@0.7.0"
  - "@emdash-cms/registry-moderation@0.2.0"
  - "@emdash-cms/registry-verification@0.3.3"
