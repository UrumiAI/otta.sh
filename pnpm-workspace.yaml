packages:
  - "packages/*"

allowBuilds:
  better-sqlite3: true
  # esbuild's postinstall only validates the preinstalled platform binary —
  # wrangler bundles through it.
  esbuild: true
  # wrangler's optional image codec (Workers static-assets tooling); nothing in
  # this repo feeds it images, so skip the native build.
  sharp: false
  workerd: true

catalog:
  typescript: ^5.9.3
  vitest: ^4.1.10
  tsdown: ^0.22.4
  oxlint: ^1.73.0
  oxfmt: ^0.58.0
  kysely: ^0.29.3
  pg: ^8.22.0
  "@types/pg": ^8.20.0
  better-sqlite3: ^12.11.1
  "@types/better-sqlite3": ^7.6.13
  zod: ^4.4.3
  hono: ^4.12.29
  "@hono/node-server": ^2.0.8
  dependency-cruiser: ^18.0.0
  wrangler: ^4.68.0
  "@changesets/cli": ^2.31.0
  "@types/node": ^22.15.0
  fast-check: ^3.23.2

minimumReleaseAgeExclude:
  - hono@4.12.29
  - "@cloudflare/workerd-darwin-64@1.20260710.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260710.1"
  - "@cloudflare/workerd-linux-64@1.20260710.1"
  - "@cloudflare/workerd-linux-arm64@1.20260710.1"
  - "@cloudflare/workerd-windows-64@1.20260710.1"
  - workerd@1.20260710.1
