packages:
  - "packages/*"
  - "sites/*"

# There are no `emdash` overrides any more. The host used to be a locally built
# merge of upstream `main` and its then-open conditional-write PR, vendored as
# `file:` tarballs and held in place by four overrides. `emdash@0.38.0` ships
# that PR, so the manifests name the release directly and the store resolves a
# single copy on its own: the released `@emdash-cms/cloudflare@0.38.0` pins
# `emdash` EXACTLY at `0.38.0`, which is the same version the manifests ask for,
# and `@emdash-cms/admin@0.38.0` / `@emdash-cms/registry-client@0.6.0` now export
# the subpaths (`./portable-text-table`, `./listing-policy`) whose absence forced
# them to be vendored alongside the core.
#
# The one-copy outcome is a coincidence of agreement, not an invariant — a future release of
# `@emdash-cms/cloudflare` that pins a DIFFERENT exact `emdash` would put a second
# copy in the store, binding the Worker bridge to a host without the
# conditional-write primitives: no install error, no type error.
# `sites/staging/test/host-pin.test.ts` is what makes that loud, and an override
# pinning `emdash` to the version the manifests name would be the fix.
#
# If pins are ever reintroduced they must never float — no `^`, no `~`: a stray
# `emdash@1.0.0` exists on npm and is NOT the latest release of this host. And
# they have to live here: pnpm 11 ignores `pnpm.overrides` in package.json
# without warning.

allowBuilds:
  better-sqlite3: true
  # esbuild's postinstall only validates the preinstalled platform binary —
  # wrangler and the Astro toolchain (sites/staging) bundle through it.
  esbuild: true
  # sharp: originally skipped for the service Worker (wrangler's optional
  # image codec, nothing fed it images) — sites/staging's Astro/EmDash chain
  # installs it as a real dependency, so the native build is allowed now.
  sharp: true
  workerd: true

catalog:
  typescript: ^5.9.3
  vitest: ^4.1.10
  tsdown: ^0.22.4
  oxlint: ^1.73.0
  oxfmt: ^0.58.0
  kysely: ^0.29.3
  pg: ^8.22.0
  "@types/pg": ^8.20.0
  better-sqlite3: ^12.11.1
  "@types/better-sqlite3": ^7.6.13
  zod: ^4.4.3
  hono: ^4.12.29
  "@hono/node-server": ^2.0.8
  dependency-cruiser: ^18.0.0
  # wrangler ^4.68 -> ^4.99 because `@emdash-cms/cloudflare` declares
  # `peerDependencies.wrangler >= 4.99.0`.
  wrangler: ^4.99.0
  "@changesets/cli": ^2.31.0
  "@types/node": ^22.15.0
  fast-check: ^3.23.2
  "@playwright/test": ^1.62.1

minimumReleaseAgeExclude:
  - hono@4.12.29
  # The D1 test tier's toolchain (`@cloudflare/vitest-plugin`), which pins its own
  # wrangler/miniflare exactly and therefore its own workerd — see the "D1 tier"
  # section of `packages/store-emdash/README.md`.
  - "@cloudflare/vitest-plugin@1.1.8"
  - "wrangler@4.131.1"
  - "miniflare@5.20260911.0-alpha"
  - "workerd@1.20260911.1"
  - "@cloudflare/workerd-darwin-64@1.20260911.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260911.1"
  - "@cloudflare/workerd-linux-64@1.20260911.1"
  - "@cloudflare/workerd-linux-arm64@1.20260911.1"
  - "@cloudflare/workerd-windows-64@1.20260911.1"
  - "@cloudflare/workerd-darwin-64@1.20260710.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260710.1"
  - "@cloudflare/workerd-linux-64@1.20260710.1"
  - "@cloudflare/workerd-linux-arm64@1.20260710.1"
  - "@cloudflare/workerd-windows-64@1.20260710.1"
  - workerd@1.20260710.1
  # Nothing in this repo sets `minimumReleaseAge`, so this list only has an
  # effect under external pnpm config (a user or CI `.npmrc`) that does.
  #
  # The whole EmDash train is listed now. It used to omit `emdash`,
  # `@emdash-cms/admin`, `@emdash-cms/cloudflare` and `@emdash-cms/registry-client`
  # because they came from `vendor/` as `file:` tarballs, which bypass the
  # release-age check entirely; they resolve from the registry again, so they
  # need the exclusion like every sibling. The 0.38.x train is younger than a
  # typical threshold.
  - "emdash@0.38.0"
  - "@emdash-cms/admin@0.38.0"
  - "@emdash-cms/auth@0.38.0"
  - "@emdash-cms/blocks@0.38.0"
  - "@emdash-cms/cloudflare@0.38.0"
  - "@emdash-cms/gutenberg-to-portable-text@0.38.0"
  - "@emdash-cms/plugin-types@0.3.1"
  - "@emdash-cms/registry-client@0.6.0"
  - "@emdash-cms/registry-lexicons@0.5.0"
  - "@emdash-cms/registry-moderation@0.2.0"
  - "@emdash-cms/registry-verification@0.3.1"
