packages:
  - "packages/*"
  - "sites/*"

allowBuilds:
  better-sqlite3: true
  # esbuild's postinstall only validates the preinstalled platform binary —
  # wrangler and the Astro toolchain (sites/staging) bundle through it.
  esbuild: true
  # sharp: originally skipped for the service Worker (wrangler's optional
  # image codec, nothing fed it images) — sites/staging's Astro/EmDash chain
  # installs it as a real dependency, so the native build is allowed now.
  sharp: true
  workerd: true

catalog:
  typescript: ^5.9.3
  vitest: ^4.1.10
  tsdown: ^0.22.4
  oxlint: ^1.73.0
  oxfmt: ^0.58.0
  kysely: ^0.29.3
  pg: ^8.22.0
  "@types/pg": ^8.20.0
  better-sqlite3: ^12.11.1
  "@types/better-sqlite3": ^7.6.13
  zod: ^4.4.3
  hono: ^4.12.29
  "@hono/node-server": ^2.0.8
  dependency-cruiser: ^18.0.0
  wrangler: ^4.68.0
  "@changesets/cli": ^2.31.0
  "@types/node": ^22.15.0
  fast-check: ^3.23.2

minimumReleaseAgeExclude:
  - hono@4.12.29
  - "@cloudflare/workerd-darwin-64@1.20260710.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260710.1"
  - "@cloudflare/workerd-linux-64@1.20260710.1"
  - "@cloudflare/workerd-linux-arm64@1.20260710.1"
  - "@cloudflare/workerd-windows-64@1.20260710.1"
  - workerd@1.20260710.1
  # emdash 0.31.1 (published 2026-07-24, npm dist-tag `latest`) — pinned
  # EXACT in sites/staging; a stray emdash@1.0.0 exists on npm from an
  # out-of-order publish and is NOT `latest`, so the pin must never float
  # (no `^`, no `~`). Same-day transitives of the 0.31.1 release train.
  - emdash@0.31.1
  - "@emdash-cms/cloudflare@0.31.1"
  - "@emdash-cms/auth@0.31.1"
  - "@emdash-cms/admin@0.31.1"
  - "@emdash-cms/gutenberg-to-portable-text@0.31.1"
  - "@emdash-cms/blocks@0.31.1"
  - "@emdash-cms/plugin-types@0.3.0"
  - "@emdash-cms/registry-client@0.3.4"
  - "@emdash-cms/registry-lexicons@0.3.0"
