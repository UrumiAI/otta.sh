packages:
  - "packages/*"
  - "sites/*"

# The host is a locally built merge of upstream EmDash `main` and its open
# conditional-write PR, packed into `vendor/` (see `vendor/README.md`).
#
# Why these are load-bearing, precisely: the vendored tarballs cross-pin each
# other at `0.37.1-otta.1` / `0.5.1-otta.1`, versions that do not exist on the
# registry, so dropping the `emdash` or `@emdash-cms/admin` override fails
# loudly at install. The quiet one is `@emdash-cms/cloudflare`: the published
# `0.37.0` of it pins `emdash` EXACTLY, so without its override a second, stock
# `emdash` resolves from the registry and the Worker bridge binds to the copy
# WITHOUT the conditional-write primitives — no install error, no type error.
# `sites/staging/test/host-pin.test.ts` asserts the one-copy outcome.
#
# The pins must never float — no `^`, no `~`: a stray `emdash@1.0.0` exists on
# npm and is NOT the latest release of this host.
#
# pnpm 11 ignores `pnpm.overrides` in package.json without warning, so the
# overrides have to live here.
overrides:
  emdash: "file:./vendor/emdash-0.37.1-otta.1.tgz"
  "@emdash-cms/admin": "file:./vendor/emdash-cms-admin-0.37.1-otta.1.tgz"
  "@emdash-cms/cloudflare": "file:./vendor/emdash-cms-cloudflare-0.37.1-otta.1.tgz"
  # The core build also imports an unreleased `registry-client` export
  # (`listing-policy`'s `isProvenFirstRelease`), so that package is vendored too.
  "@emdash-cms/registry-client": "file:./vendor/emdash-cms-registry-client-0.5.1-otta.1.tgz"

allowBuilds:
  better-sqlite3: true
  # esbuild's postinstall only validates the preinstalled platform binary —
  # wrangler and the Astro toolchain (sites/staging) bundle through it.
  esbuild: true
  # sharp: originally skipped for the service Worker (wrangler's optional
  # image codec, nothing fed it images) — sites/staging's Astro/EmDash chain
  # installs it as a real dependency, so the native build is allowed now.
  sharp: true
  workerd: true

catalog:
  typescript: ^5.9.3
  vitest: ^4.1.10
  tsdown: ^0.22.4
  oxlint: ^1.73.0
  oxfmt: ^0.58.0
  kysely: ^0.29.3
  pg: ^8.22.0
  "@types/pg": ^8.20.0
  better-sqlite3: ^12.11.1
  "@types/better-sqlite3": ^7.6.13
  zod: ^4.4.3
  hono: ^4.12.29
  "@hono/node-server": ^2.0.8
  dependency-cruiser: ^18.0.0
  # wrangler ^4.68 -> ^4.99 because the vendored `@emdash-cms/cloudflare`
  # declares `peerDependencies.wrangler >= 4.99.0`.
  wrangler: ^4.99.0
  "@changesets/cli": ^2.31.0
  "@types/node": ^22.15.0
  fast-check: ^3.23.2
  "@playwright/test": ^1.62.1

minimumReleaseAgeExclude:
  - hono@4.12.29
  - "@cloudflare/workerd-darwin-64@1.20260710.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260710.1"
  - "@cloudflare/workerd-linux-64@1.20260710.1"
  - "@cloudflare/workerd-linux-arm64@1.20260710.1"
  - "@cloudflare/workerd-windows-64@1.20260710.1"
  - workerd@1.20260710.1
  # Nothing in this repo sets `minimumReleaseAge`, so this list only has an
  # effect under external pnpm config (a user or CI `.npmrc`) that does.
  #
  # The four vendored packages (`emdash`, `@emdash-cms/admin`,
  # `@emdash-cms/cloudflare`, `@emdash-cms/registry-client`) come from `vendor/`
  # as `file:` tarballs, which bypass the release-age check entirely — no
  # exclusion needed for them. Every sibling that still resolves from the
  # registry is listed here, because the 0.37.x train is younger than a typical
  # threshold.
  - "@emdash-cms/auth@0.37.0"
  - "@emdash-cms/blocks@0.37.0"
  - "@emdash-cms/gutenberg-to-portable-text@0.37.0"
  - "@emdash-cms/plugin-types@0.3.1"
  - "@emdash-cms/registry-lexicons@0.4.0"
  - "@emdash-cms/registry-moderation@0.1.0"
  - "@emdash-cms/registry-verification@0.3.0"
